name: Instance template

# Advisory, like the other workflows here: not a required check.
# - drift: scripts/generate-config-template.sh output must equal a clone of the
#   public skrsi-config-template repo. That repo does not exist yet, so until it
#   is created the job prints a notice and does nothing.
# - scrub: no real estate name or address in the framework or the template.
#   The private SKRSI_ESTATE_DENYLIST secret carries real names so no public
#   file spells them out; on a fork it is empty and the public half still runs.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: instance-template-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Diff the generated template with the published template repo
        run: |
          set -euo pipefail
          url=https://github.com/smilinTux/skrsi-config-template.git
          if ! GIT_TERMINAL_PROMPT=0 git ls-remote --exit-code "$url" HEAD >/dev/null 2>&1; then
            echo "::notice::smilinTux/skrsi-config-template does not exist or is not readable yet; drift check skipped (no-op until it is created)."
            exit 0
          fi
          git clone --quiet --depth 1 "$url" "$RUNNER_TEMP/published"
          scripts/generate-config-template.sh "$RUNNER_TEMP/generated"
          if ! diff -r --exclude=.git "$RUNNER_TEMP/generated" "$RUNNER_TEMP/published"; then
            echo "::error::skrsi-config-template has drifted from templates/instance-repo/. Regenerate it with scripts/generate-config-template.sh and push the result to the template repo."
            exit 1
          fi

  scrub:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Public artifact scan
        run: python scripts/validate_public.py .
      - name: Scrub the framework
        env:
          SKRSI_ESTATE_DENYLIST: ${{ secrets.SKRSI_ESTATE_DENYLIST }}
        run: python scripts/validate_instance.py --scrub .
      - name: Scrub the template, names and domains included
        env:
          SKRSI_ESTATE_DENYLIST: ${{ secrets.SKRSI_ESTATE_DENYLIST }}
        run: python scripts/validate_instance.py --scrub --hostnames templates/instance-repo
      - name: The template validates as an instance
        run: python scripts/validate_instance.py --cluster templates/instance-repo/cluster.yaml.example templates/instance-repo
